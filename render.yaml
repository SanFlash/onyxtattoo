services:
  - type: web
    name: onyx-tattoo-studio
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_NAME
        value: ONYX TATTOO STUDIO
